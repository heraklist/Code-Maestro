name: Documentation Consistency

on:
  push:
    branches:
      - docs/architecture-foundation-v0.1
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'tools/doc_consistency.py'
      - 'tests/test_doc_consistency.py'
      - '.github/workflows/documentation-consistency.yml'

permissions:
  contents: read

jobs:
  documentation-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: python -m unittest tests.test_doc_consistency -v

      - name: Run repository documentation checker
        run: python tools/doc_consistency.py
