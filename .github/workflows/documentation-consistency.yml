name: Documentation Consistency

on:
  push:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'logs/**'
      - 'evals/**'
      - 'tools/doc_consistency.py'
      - 'tools/check_append_only_logs.py'
      - 'tools/routing_eval.py'
      - 'tools/routing_skeleton.py'
      - 'tests/test_doc_consistency.py'
      - 'tests/test_routing_eval.py'
      - 'tests/test_routing_skeleton.py'
      - '.github/workflows/documentation-consistency.yml'

permissions:
  contents: read

jobs:
  documentation-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate routing pilot
        run: python tools/routing_eval.py validate evals/routing/pilot-real-derived.json

      - name: Reproduce routing pilot skeleton output
        run: |
          python tools/routing_skeleton.py \
            --cases evals/routing/pilot-real-derived.json \
            --output /tmp/pilot-skeleton-v0.json
          cmp /tmp/pilot-skeleton-v0.json evals/routing/results/pilot-skeleton-v0.json

      - name: Run repository documentation checker
        run: python tools/doc_consistency.py

      - name: Enforce append-only project ledgers
        run: python tools/check_append_only_logs.py HEAD^
